# Builds, tests and releases video-dispatch when the deploy branch is pushed to (a merge into deploy included), and at
# no other time. master holds the source and nothing is built from it. The version is the one in VERSION (build.ps1
# -Bump changes it), and a version is released once: pushing to deploy without a new one fails. The organization allows
# only actions pinned to a full commit SHA: the tag each one is pinned at is beside it.
name: Build and release

on:
  push:
    branches: [deploy]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      # A run's log can only be read signed in, and its annotations by anyone, so the failures go there too.
      - name: Test
        shell: pwsh
        run: |
          dotnet test *>&1 | Tee-Object -FilePath test-log.txt
          if ($LASTEXITCODE -ne 0) {
            $failures = Select-String test-log.txt -Pattern '^failed ' -Context 0,12 | ForEach-Object { $_.Line; $_.Context.PostContext }
            $message = ($failures -join "`n").Replace('%', '%25').Replace("`r", '').Replace("`n", '%0A')
            "::error title=Failed tests::$message"
            exit 1
          }

  build:
    name: Build win-x64, needs-dotnet
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - name: Publish
        shell: bash
        run: |
          dotnet publish src/VideoDispatch -c Release -r win-x64 -o out/video-dispatch
          cp README.md LICENSE out/video-dispatch/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: video-dispatch-win-x64-needs-dotnet
          path: out/video-dispatch
          if-no-files-found: error

  release:
    name: Release
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(tr -d ' \r\n' < VERSION)
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version is already released. Raise the version (build.ps1 -Bump revision) and push again."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      # By name, into a folder of its own: downloaded without a name, a single artifact's files land straight in path,
      # with no folder named after it to pack.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: video-dispatch-win-x64-needs-dotnet
          path: artifacts/video-dispatch-win-x64-needs-dotnet
      - name: Pack
        run: |
          mkdir dist
          cd artifacts
          ls -R
          for dir in video-dispatch-*/; do
            dir=${dir%/}
            suffix=${dir#video-dispatch-}
            name="video-dispatch-$VERSION-$suffix"
            mv "$dir" "$name"
            zip -qr "../dist/$name.zip" "$name"
          done
          cd ../dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "video-dispatch $VERSION" \
            --notes "Built from $GITHUB_SHA on the deploy branch. For Windows 10 and 11 on x64 PCs: unpack and run \`video-dispatch.exe\`. It runs on the .NET 10 Desktop Runtime installed on the PC (https://dotnet.microsoft.com/download/dotnet/10.0), which Microsoft Update keeps patched. The SHA-256 checksum is in SHA256SUMS."
